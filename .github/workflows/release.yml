name: Release

# Tags publish the player, two console servers, Windows controller, installer and checksums.
# Manual runs keep the same files as build artifacts without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Player and portable DSP servers
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Work out the version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "0.0.0-dev" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the package
        shell: pwsh
        run: ./build/release.ps1 -Version $env:VERSION

      - name: Keep the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUPlayer-${{ env.VERSION }}
          path: artifacts/release-${{ env.VERSION }}/*
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md; GitHub writes its own notes when there is none.
          $notes = [System.Collections.Generic.List[string]]::new()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') {
              if ($inside) { break }
              $inside = $line -match ('^## \[?' + [regex]::Escape($env:VERSION) + '\]?(\s|$)')
              continue
            }
            if ($inside) { $notes.Add($line) }
          }
          $text = ($notes -join "`n").Trim()
          $packages = @(Get-ChildItem "artifacts/release-$env:VERSION" -File | ForEach-Object FullName)
          if ($packages.Count -ne 6) { throw 'Expected player, two console servers, Windows controller, installer and checksums.' }
          if ($text) {
            Set-Content -Path release-notes.md -Value $text -Encoding utf8
            gh release create $env:GITHUB_REF_NAME @packages --title "FUPlayer $env:GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag --latest
          } else {
            gh release create $env:GITHUB_REF_NAME @packages --title "FUPlayer $env:GITHUB_REF_NAME" --generate-notes --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
